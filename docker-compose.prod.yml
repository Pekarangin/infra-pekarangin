# ============================================================
# Docker Compose Production Override — Pekarang.in
# Penggunaan:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# ============================================================

services:
  postgres:
    restart: always

  ai-service:
    restart: always
    environment:
      ENVIRONMENT: production
    volumes: []
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  backend:
    build:
      context: ../be-pekarangin
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
    volumes: []
    command: sh -c "npx prisma db push && node prisma/seed.js && npm start"
